{% extends 'base.html' %}

{% block content %}
<div class="form-container glass-panel">
    <div class="auth-header">
        <h2>Start Your Journey</h2>
        <p>Create your profile to prepare for your next big role.</p>
    </div>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <div class="form-group">
            <label for="domain">Target Domain</label>
            <select id="domain" name="domain" class="form-control" required>
                <option value="" disabled selected>Select a domain...</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Data Science">Data Science</option>
                <option value="Machine Learning">Machine Learning</option>
                <option value="Web Development">Web Development</option>
                <option value="Cloud Computing">Cloud Computing</option>
            </select>
        </div>

        <div class="form-group">
            <label for="skill_level">Skill Level</label>
            <select id="skill_level" name="skill_level" class="form-control" required>
                <option value="" disabled selected>Select your level...</option>
                <option value="Beginner">Beginner (Need Learning Path)</option>
                <option value="Intermediate">Intermediate (Need Practice)</option>
                <option value="Pro">Pro (Mock Interviews Only)</option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="{{ url_for('login') }}">Log in here</a>
    </p>
</div>
{% endblock %}
